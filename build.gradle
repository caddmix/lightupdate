plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// only used for the optional compat run (-Pcompat), never for the shipped jar
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

sourceSets {
	// scripted test scenes for dev runs, never part of the shipped jar
	harness {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		lightupdate {
			sourceSet sourceSets.main
		}
		lightupdate_harness {
			sourceSet sourceSets.harness
		}
	}

	runs {
		// ./gradlew runHarness -Pscene=candle|lamp|crowd
		harness {
			inherit client
			name 'Harness Client'
			source sourceSets.harness
			runDir 'run-harness'
			property 'lightupdate.harness', (project.findProperty('scene') ?: 'candle').toString()
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	if (project.hasProperty('compat')) {
		// the renderer stack most 1.21.1 packs run, for compat checks in the dev client
		modLocalRuntime 'maven.modrinth:sodium:SMxNOGZ6' // 0.8.13
		modLocalRuntime 'maven.modrinth:iris:bAo1Qhte' // 1.8.14-beta.1
		modLocalRuntime 'maven.modrinth:immediatelyfast:aLnBqxFW' // 1.6.15
		modLocalRuntime 'maven.modrinth:entityculling:yllJFBpU' // 1.11.3
	}
}

// production style harness jar (intermediary names) for launching next to real release jars of other mods
def harnessJar = tasks.register('harnessJar', Jar) {
	from sourceSets.harness.output
	archiveClassifier = 'harness-dev'
}

tasks.register('remapHarnessJar', net.fabricmc.loom.task.RemapJarTask) {
	dependsOn harnessJar
	inputFile = harnessJar.flatMap { it.archiveFile }
	archiveClassifier = 'harness'
	addNestedDependencies = false
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_$projectName" }
	}
}
